name: saas-platform-prod

x-redis-password: &redis_password '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
x-mongo-user: &mongo_user '${MONGO_ROOT_USER:-root}'
x-mongo-password: &mongo_password '${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}'

services:
  nginx:
    image: nginx:1.29.6-alpine
    container_name: nginx-prod
    entrypoint: ['nginx', '-g', 'daemon off;']
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    volumes:
      - ./nginx/sites/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - saas-edge
      # Necesario para proxyar /socket.io/ directo a notification-service
      # (WebSocket con auth propia, no pasa por api-gateway).
      - saas-internal

  api-gateway:
    container_name: api-gateway-prod
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: api-gateway
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_SERVICE_TIMEOUT: ${AUTH_SERVICE_TIMEOUT:-5000}
      AUTH_SERVICE_RETRIES: ${AUTH_SERVICE_RETRIES:-2}
      AUTH_SERVICE_CIRCUIT_TIMEOUT: ${AUTH_SERVICE_CIRCUIT_TIMEOUT:-10000}
      CONFIG_SERVICE_URL: http://config-service:3002
      # Debe coincidir con el INTERNAL_SERVICE_SECRET de config-service (ver InternalServiceGuard)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: *redis_password
    depends_on:
      auth-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/v1/health >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-edge
      - saas-internal

  auth-service:
    container_name: auth-service-prod
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: auth-service
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-auth_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@auth-postgres:5432/${POSTGRES_DB:-auth_db}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongo:27017/${MONGO_DB:-auth_audit}?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-604800}
      REDIS_SESSION_TTL: ${REDIS_SESSION_TTL:-900}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: *redis_password
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      # Debe coincidir con el INTERNAL_SERVICE_SECRET de notification-service (ver InternalServiceGuard)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/auth/v1/metrics >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-internal
      - saas-data

  auth-postgres:
    image: postgres:17-alpine
    container_name: auth-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - auth-postgres-prod-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    networks:
      - saas-data

  config-service:
    container_name: config-service-prod
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: config-service
      PORT: 3002
      DATABASE_URL: postgresql://${CONFIG_POSTGRES_USER:-config_user}:${CONFIG_POSTGRES_PASSWORD:?CONFIG_POSTGRES_PASSWORD is required}@config-postgres:5432/${CONFIG_POSTGRES_DB:-config_db}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongo:27017/${CONFIG_MONGO_DB:-config_audit}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: *redis_password
      CONFIG_CACHE_TTL: ${CONFIG_CACHE_TTL:-300}
      # Debe coincidir con el INTERNAL_SERVICE_SECRET de api-gateway (ver InternalServiceGuard)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
    depends_on:
      config-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3002/config/v1/metrics >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-internal
      - saas-data

  config-postgres:
    image: postgres:17-alpine
    container_name: config-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONFIG_POSTGRES_DB:-config_db}
      POSTGRES_USER: ${CONFIG_POSTGRES_USER:-config_user}
      POSTGRES_PASSWORD: ${CONFIG_POSTGRES_PASSWORD:?CONFIG_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${CONFIG_POSTGRES_USER:-config_user} -d ${CONFIG_POSTGRES_DB:-config_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - config-postgres-prod-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-data

  notification-service:
    container_name: notification-service-prod
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: notification-service
      PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: *redis_password
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      EMAIL_QUEUE_ATTEMPTS: ${EMAIL_QUEUE_ATTEMPTS:-5}
      EMAIL_QUEUE_BACKOFF_DELAY: ${EMAIL_QUEUE_BACKOFF_DELAY:-5000}
      WS_QUEUE_ATTEMPTS: ${WS_QUEUE_ATTEMPTS:-3}
      WS_QUEUE_BACKOFF_DELAY: ${WS_QUEUE_BACKOFF_DELAY:-2000}
      WS_CORS_ORIGINS: ${WS_CORS_ORIGINS:?WS_CORS_ORIGINS is required}
      # Debe coincidir con el INTERNAL_SERVICE_SECRET de auth-service (ver InternalServiceGuard)
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET is required}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3003/notifications/v1/metrics >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-internal

  redis:
    image: redis:8.0.6-alpine
    container_name: redis-prod
    restart: unless-stopped
    command: ['redis-server', '--requirepass', *redis_password, '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', *redis_password, '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-prod-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - saas-internal

  mongo:
    image: mongo:8.2
    container_name: mongo-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: *mongo_user
      MONGO_INITDB_ROOT_PASSWORD: *mongo_password
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '-u',
          *mongo_user,
          '-p',
          *mongo_password,
          '--authenticationDatabase',
          'admin',
          '--eval',
          'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-prod-data:/data/db
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    networks:
      - saas-data

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus-prod
    restart: unless-stopped
    profiles: ['observability']
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - saas-internal

  loki:
    image: grafana/loki:3.5.12
    container_name: loki-prod
    restart: unless-stopped
    profiles: ['observability']
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-prod-data:/loki
    command: -config.file=/etc/loki/loki.yml
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - saas-internal

  promtail:
    image: grafana/promtail:3.5.12
    container_name: promtail-prod
    restart: unless-stopped
    profiles: ['observability']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - saas-internal

  grafana:
    image: grafana/grafana:12.4.1
    container_name: grafana-prod
    restart: unless-stopped
    profiles: ['observability']
    ports:
      - '${GRAFANA_PORT:-3005}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-prod-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - saas-internal

networks:
  # Public-facing tier: nginx <-> api-gateway.
  # nginx also joins saas-internal (below) to proxy /socket.io/ directly to
  # notification-service, bypassing api-gateway for that one route.
  saas-edge:
    driver: bridge
  # Service-to-service tier: api-gateway, auth-service, config-service, notification-service,
  # redis, observability, and nginx (only for the /socket.io/ WebSocket proxy).
  # Deliberately excludes the data tier so api-gateway/nginx cannot reach the databases directly.
  # Not marked `internal: true` because prometheus/loki/grafana publish ports to the host.
  saas-internal:
    driver: bridge
  # Private data tier: only auth-service and config-service may reach it.
  # No container on this network publishes host ports, so it's fully isolated from outside.
  saas-data:
    driver: bridge
    internal: true

volumes:
  auth-postgres-prod-data:
  config-postgres-prod-data:
  redis-prod-data:
  mongo-prod-data:
  prometheus-prod-data:
  loki-prod-data:
  grafana-prod-data:
