# Connection: "upgrade" solo cuando el cliente pide un upgrade real (WebSocket);
# de lo contrario nginx debe cerrar la conexión al backend en vez de mantenerla.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 ipv6=off valid=30s;

  location /api/ {
    set $api_gateway_upstream http://api-gateway:3000;

    rewrite ^/api/?(.*)$ /$1 break;

    proxy_pass $api_gateway_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  # =====================
  # WebSocket de notificaciones (Socket.IO)
  # notification-service valida su propio JWT en el handshake
  # (cookie accessToken); no pasa por api-gateway.
  # =====================
  location /socket.io/ {
    set $notification_upstream http://notification-service:3003;
    proxy_pass $notification_upstream;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Conexiones WebSocket son de larga duración; el timeout corto por
    # defecto de nginx las cortaría en medio de una sesión activa.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
