global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ============================
  # API GATEWAY
  # ============================
  - job_name: 'api-gateway'
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - api-gateway:3000
        labels:
          service: api-gateway

  # ============================
  # AUTH SERVICE
  # ============================
  - job_name: 'auth-service'
    metrics_path: /auth/v1/metrics
    static_configs:
      - targets:
          - auth-service:3001
        labels:
          service: auth-service

  # ============================
  # NOTIFICATION SERVICE
  # ============================
  - job_name: 'notification-service'
    metrics_path: /notifications/v1/metrics
    static_configs:
      - targets:
          - notification-service:3003
        labels:
          service: notification-service

  # ============================
  # CONFIG SERVICE
  # ============================
  - job_name: 'config-service'
    metrics_path: /config/v1/metrics
    static_configs:
      - targets:
          - config-service:3002
        labels:
          service: config-service

  # ============================
  # POSTGRES EXPORTER (auth-postgres)
  # ============================
  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          database: auth_db

  # ============================
  # POSTGRES EXPORTER (config-postgres)
  # ============================
  - job_name: 'postgres-exporter-config'
    static_configs:
      - targets:
          - postgres-exporter-config:9187
        labels:
          database: config_db

  # ============================
  # REDIS EXPORTER
  # ============================
  - job_name: 'redis-exporter'
    static_configs:
      - targets:
          - redis-exporter:9121

  # ============================
  # CADVISOR (Container Metrics)
  # ============================
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - cadvisor:8080

  # ============================
  # PROMETHEUS SELF-MONITORING
  # ============================
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - localhost:9090
