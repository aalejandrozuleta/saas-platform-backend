sonar.projectKey=aalejandrozuleta_saas-platform-backend
sonar.organization=aalejandrozuleta
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Source configuration
sonar.sources=services,shared
sonar.tests=services,shared

# Typescript configs
sonar.typescript.tsconfigPaths=services/api-gateway/tsconfig.json,services/auth-service/tsconfig.json,services/config-service/tsconfig.json,shared/tsconfig.json

# Exclusions
sonar.exclusions=\
**/dist/**,\
**/node_modules/**,\
**/coverage/**,\
**/*.d.ts,\
**/generated/**,\
**/migrations/**,\
docker/**,\
docs/**,\
**/*.module.ts,\
**/main.ts

# Test files
sonar.test.inclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/__tests__/**

# Coverage reports
sonar.javascript.lcov.reportPaths=\
services/**/coverage/lcov.info,\
shared/**/coverage/lcov.info

# Coverage exclusions
sonar.coverage.exclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/__tests__/**,\
**/*.module.ts,\
**/main.ts,\
**/*.d.ts,\
**/generated/**

# Duplication exclusions
# Per-service infra boilerplate (guards, proxies, metrics, storage clients)
# is intentionally duplicated across services — each is independently
# deployable and hexagonal boundaries deliberately avoid a shared runtime
# package for this (see docs/architecture). Email template components
# share the same Base-wrapped structural boilerplate by design too.
sonar.cpd.exclusions=\
**/*.spec.ts,\
**/*.test.ts,\
**/__tests__/**,\
**/generated/**,\
**/infrastructure/security/*.guard.ts,\
**/infrastructure/http/proxies/*.ts,\
**/infrastructure/metrics/*.ts,\
**/infrastructure/storage/*.ts,\
**/templates/emails/*.ts

# Ignore specific docker rules — dev images intentionally run as root
# (hot-reload containers, non-root not required; see NOSONAR comment in
# each services/*/Dockerfile.dev)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile*
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Dockerfile*

# New code reference branch
sonar.newCode.referenceBranch=main